# Builds and tests every push to main and every pull request.
# CI builds are versioned 0.0.<run number> so test MSIs can be told apart.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: 0.0.${{ github.run_number }}
