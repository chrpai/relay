name: build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cc65, lrzsz, py65
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65 lrzsz
          pip install py65
      - name: Assemble both builds
        run: sh src/build.sh
      - name: Emulator tests
        working-directory: test
        env: { TELNET: "1", SWL: "1", ZPRG: ../src/zmodem.prg }
        run: |
          python3 tests.py 't_download_single(60000)' 't_download_batch()' 't_upload_single(30720)' 't_upload_batch()' | tee out.txt
          ! grep -q MISMATCH out.txt
      - name: Emulator tests, Ultimate Net build (REU)
        working-directory: test
        env: { ZPRG: ../src/zmodem-net.prg }
        run: |
          REU=16384 python3 tests.py 't_download_single(174848)' 't_download_batch()' 't_upload_single(30720)' 't_upload_batch()' | tee net.txt
          REU=128 python3 tests.py 't_download_reu_too_small()' | tee -a net.txt
          python3 tests.py 't_download_single(5000)' | tee -a net.txt
          ! grep -q MISMATCH net.txt
      # GitHub turns spaces in asset names into dots, so the exact
      # C64 names go inside a D81 image and a zip.
      - name: Package
        run: |
          mkdir dist
          python3 tools/mkd81.py dist/zmodem.d81 "++ ZMODEM=src/zmodem.prg" \
            "S.M.PROTOS=s.m.protos.seq:seq" "S.PROTOS=s.protos.seq:seq"
          python3 tools/mkd81.py dist/zmodem-net.d81 "++ ZMODEM=src/zmodem-net.prg" \
            "S.M.PROTOS=s.m.protos-net.seq:seq" "S.PROTOS=s.protos.seq:seq"
          python3 -c "import zipfile; z=zipfile.ZipFile('dist/zmodem.zip','w',zipfile.ZIP_DEFLATED); [z.write(a,b) for a,b in [('src/zmodem.prg','++ zmodem.prg'),('src/zmodem-log.prg','++ zmodem-log.prg'),('s.m.protos.seq','s.m.protos.seq'),('s.protos.seq','s.protos.seq'),('src/zmodem-net.prg','ultimate-net/++ zmodem.prg'),('s.m.protos-net.seq','ultimate-net/s.m.protos.seq'),('s.protos.seq','ultimate-net/s.protos.seq')]]; z.close()"
          cp src/zmodem.prg src/zmodem-log.prg src/zmodem-net.prg s.m.protos.seq s.m.protos-net.seq s.protos.seq dist/
      - uses: actions/upload-artifact@v4
        with:
          name: zmodem
          path: dist/
      - name: Release (every push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: dist/*
